<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finance Hub">
<title>Izud Finance Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <h1 id="pageTitle">Finance Hub</h1>
  <div class="hdr-r"><span class="ver" id="verLabel" title="Versi app — ketuk untuk Pengaturan"></span><span class="rate" id="rateLabel"></span><button class="dot local" id="syncDot" title="status sinkron" aria-label="Sinkron sekarang"></button>
    <button id="gear" aria-label="Pengaturan">⚙︎</button></div>
</header>
<div id="syncBar" role="status"></div>
<main id="view"><div class="skel"></div><div class="skel"></div></main>
<nav>
  <button data-page="home"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-5.5h5V20"/></svg></span>Beranda</button>
  <button data-page="transaksi"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h11M4 12h11M4 17h7"/><circle cx="19" cy="7" r="1.3"/><circle cx="19" cy="12" r="1.3"/><circle cx="18" cy="17" r="1.3"/></svg></span>Transaksi</button>
  <button data-page="add" class="center active"><span class="ico plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span></button>
  <button data-page="budget"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-2.5-1.5L13 21l-2.5-1.5L8 21l-2-1.5V3Z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg></span>Budget</button>
  <button data-page="more"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg></span>More</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="overlay"><div id="modal" role="dialog" aria-modal="true"></div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
