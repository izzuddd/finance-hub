<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6fed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finance Hub">
<title>Izud Finance Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <h1 id="pageTitle">Finance Hub</h1>
  <div class="hdr-r"><span class="rate" id="rateLabel"></span><button class="dot local" id="syncDot" title="status sinkron" aria-label="Sinkron sekarang"></button>
    <button id="gear" aria-label="Pengaturan">⚙︎</button></div>
</header>
<main id="view"><div class="skel"></div><div class="skel"></div></main>
<nav>
  <button data-page="insight"><span class="ico">📊</span>Insight</button>
  <button data-page="saving"><span class="ico">💰</span>Tabungan</button>
  <button data-page="add" class="active"><span class="ico plus">＋</span>Catat</button>
  <button data-page="budget"><span class="ico">🧾</span>Budget</button>
  <button data-page="plan"><span class="ico">🗺️</span>Rencana</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="overlay"><div id="modal" role="dialog" aria-modal="true"></div></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
